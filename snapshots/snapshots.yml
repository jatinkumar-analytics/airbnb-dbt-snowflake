version: 2

snapshots:
  - name: snap_listings_history
    relation: ref('silver_listings')
    config:
      database: AIRBNB
      schema: GOLD
      unique_key: LISTING_ID
      strategy: timestamp
      updated_at: CREATED_AT
      dbt_valid_to_current: "to_timestamp_ntz('9999-12-31 00:00:00')"

  - name: snap_hosts_history
    relation: ref('silver_hosts')
    config:
      database: AIRBNB
      schema: GOLD
      unique_key: HOST_ID
      strategy: timestamp
      updated_at: CREATED_AT
      dbt_valid_to_current: "to_timestamp_ntz('9999-12-31 00:00:00')"