version: 2

models:
  - name: silver_booking
    description: Cleaned and enriched Airbnb booking records
    columns: 
    - name: BOOKING_ID
      tests: 
       - unique
       - not_null

    - name: LISTING_ID 
      tests: 
       - not_null 

  - name: silver_listings
    description: Cleaned Airbnb listing information.
    columns: 
     - name: LISTING_ID
       tests: 
        - not_null 

     - name: HOST_ID
       tests: 
        - not_null

  - name: silver_hosts
    description: Cleaned Airbnb host information
    columns: 
    - name: HOST_ID
      tests: 
      - unique
      - not_null

