version: 2

models:

  - name: dim_listings
    description: Current business attributes for Airbnb listings.
    columns:

      - name: LISTING_ID
        tests:
          - unique
          - not_null


  - name: dim_hosts
    description: Current business attributes for Airbnb hosts.
    columns:

      - name: HOST_ID
        tests:
          - unique
          - not_null


  - name: dim_date
    description: Calendar dimension used for booking date analysis.
    columns:

      - name: DATE_KEY
        tests:
          - unique
          - not_null

      - name: DATE_DAY
        tests:
          - unique
          - not_null


  - name: fact_bookings
    description: Booking-grain fact table containing booking measures and dimension keys.
    columns:

      - name: BOOKING_ID
        tests:
          - unique
          - not_null

      - name: LISTING_ID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: LISTING_ID

      - name: HOST_ID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts')
                field: HOST_ID

      - name: DATE_KEY
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: DATE_KEY

      - name: GRAND_TOTAL
        tests:
          - not_null